appId: com.mintlab.desktop
productName: Mint OS
asar: true
npmRebuild: false
electronLanguages:
  - en-US
  - pt-BR
directories:
  output: release
files:
  - dist/**
  - electron/**
  - package.json
extraMetadata:
  main: electron/main.cjs
portable:
  useZip: true
win:
  icon: build/mint-icon.ico
  target:
    - target: portable
      arch:
        - x64
artifactName: MintOS-${version}-${arch}-portable.${ext}